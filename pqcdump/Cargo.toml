[package]
name = "pqcdump"
version = "0.1.0"
edition = "2024"

[dependencies]
pcap = { version = "2", features = ["capture-stream"] }
etherparse = "0.19"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.145"
rust-embed = { version = "8.5.0", features = ["include-exclude", "interpolate-folder-path"] }
clap = { version = "4", features = ["derive"] }
log = "0.4.25"
linked_hash_set = { version ="0.1.6", features = ["serde"] }
tera = "1.20.0"
chrono = { version = "0.4.39", features = ["serde"] }
env_logger = "0.11.11"
